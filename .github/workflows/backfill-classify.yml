name: Backfill classification

# Run the catch-up classification without anyone opening a terminal.
#
# The candidate set is data/backfill_candidates.json: 9,465 BU works that this
# project has never evaluated, found by asking OpenAlex and PubMed what BU has
# and diffing against the master dataset. About $28 at Anthropic batch rates.
#
# The Batch API is asynchronous and takes hours, so this is three button
# presses rather than one:
#
#   1. stage: estimate   -- prints the exact cost, changes nothing
#   2. stage: submit     -- sends the batch, commits the batch id
#   3. stage: collect    -- fetches results, merges into master, commits
#
# Between 2 and 3, run `stage: status` whenever you want to see if it is done.
#
# stage: clean-master is separate and unrelated to the batch. It runs
# clean_master_bu_years.py --apply, which removes the 858 papers already in
# master that sit outside their author's documented BU years -- Mari
# Ostendorf's Washington papers, Mac Schwager's Stanford ones. It backs master
# up first and archives every removed record.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "What to do"
        required: true
        default: estimate
        type: choice
        options: [estimate, submit, status, collect, merge-only, clean-master]
      input_file:
        description: "Candidates file"
        required: true
        default: data/backfill_candidates.json
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      # Proves the secret actually reaches the runner. A key that is configured
      # but not plumbed through looks identical to no key at all until a harvest
      # truncates months later, so check it where it is cheap to check.
      - name: Check OpenAlex auth
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python - <<'EOF'
          import requests
          from config import BU_ROR_ID, CONTACT_EMAIL, OPENALEX_API_KEY, openalex_headers
          print("OPENALEX_API_KEY reaches the runner:", bool(OPENALEX_API_KEY))
          r = requests.get("https://api.openalex.org/works",
                           params={"filter": f"institutions.ror:{BU_ROR_ID}",
                                   "per_page": 1, "mailto": CONTACT_EMAIL},
                           headers=openalex_headers(), timeout=30)
          print("works endpoint:", r.status_code)
          if r.status_code == 200:
              m = r.json()["meta"]
              print(f"  BU works visible: {m['count']:,}   cost this call: ${m.get('cost_usd')}")
          else:
              print(" ", r.text[:200])
              raise SystemExit("OpenAlex is not usable from CI")
          EOF

      - name: Show what is about to happen
        run: |
          python - <<'PY'
          import json, os
          d = json.load(open(os.environ["INPUT_FILE"]))
          print(f"{len(d):,} candidates in {os.environ['INPUT_FILE']}")
          yrs = [p.get("year") for p in d if p.get("year")]
          print(f"years {min(yrs)}-{max(yrs)}")
          PY
        env:
          INPUT_FILE: ${{ inputs.input_file }}

      # `submit` needs the batch request file that `estimate` writes. Runners
      # are ephemeral, so the file from the estimate run is long gone and
      # submit has to rebuild it here. The first attempt at this did not, found
      # no batch file, printed a message, exited 0, and reported a green run
      # that had submitted nothing.
      - name: Build the batch file
        if: inputs.stage == 'submit'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CI: "true"
        run: python classify_papers.py estimate --input=${{ inputs.input_file }}

      - name: Run the stage
        if: inputs.stage != 'clean-master' && inputs.stage != 'merge-only'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CI: "true"
        run: python classify_papers.py ${{ inputs.stage }} --input=${{ inputs.input_file }}

      # Belt and braces. classify_papers now exits non-zero on a missing
      # prerequisite, but a submit that produced no batch id is the one failure
      # that must never be reported as success.
      - name: Verify the batch actually went
        if: inputs.stage == 'submit'
        run: |
          f="data/$(basename ${{ inputs.input_file }} .json)_batch_id.txt"
          test -s "$f" || { echo "No batch id at $f -- nothing was submitted"; exit 1; }
          echo "batch id: $(cat "$f")"

      - name: Clean papers outside their author's BU years
        if: inputs.stage == 'clean-master'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python clean_master_bu_years.py            # dry run first, so the log shows what goes
          python clean_master_bu_years.py --apply
          python validate_dataset.py

      # merge_batch_results.py takes --input, and the results file name is
      # derived from the candidates file stem the same way classify_papers
      # derives it. The first collect run omitted the flag, argparse exited 2,
      # and the results sat on a runner that was then destroyed -- $12.96 of
      # classification downloaded and thrown away, recoverable only because
      # batch results stay retrievable for 29 days.
      # merge-only re-runs the merge against a results file already in the
      # repo, without re-downloading. Needed because the first merge ran
      # against candidate records that carried no author data, so
      # verify_bu_authors found zero BU authors on all 1,833 AI-relevant papers
      # and filed every one of them in the non-BU index -- permanently blocking
      # papers that came from a BU-ROR-filtered query in the first place.
      - name: Merge results into master
        if: inputs.stage == 'collect' || inputs.stage == 'merge-only'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          results="data/$(basename ${{ inputs.input_file }} .json)_results.json"
          test -s "$results" || { echo "No results at $results"; exit 1; }
          python merge_batch_results.py --input="$results"
          python validate_dataset.py

      # Master changed, so the site has to change with it. Without this the
      # web app and the README keep reporting the old paper count -- the merge
      # that added 1,476 papers left marc-woernle.github.io still saying 11,903,
      # which is the kind of gap nobody notices until someone cites the number.
      - name: Regenerate the web app and propagate counts
        if: inputs.stage == 'collect' || inputs.stage == 'merge-only' || inputs.stage == 'clean-master'
        run: |
          python generate_data_js.py
          python propagate_counts.py --no-gh

      # Committed so the batch id survives between the submit run and the
      # collect run, and so the merged master is what everyone sees. Authored
      # as the repo owner: this project forbids AI attribution in git history
      # and enforces it in CI, see .github/workflows/no-ai-attribution.yml.
      - name: Commit whatever changed
        if: inputs.stage != 'estimate' && inputs.stage != 'status'
        run: |
          git config user.name 'Marc Woernle'
          git config user.email 'marcwho13@gmail.com'
          # README.md and STATUS.md too. propagate_counts patches them on the
          # runner, and staging only data/output/docs meant those edits were
          # made and then thrown away with the runner -- which is why the
          # README kept advertising 11,903 papers after master reached 12,528.
          git add -A data/ output/ docs/ README.md STATUS.md || true
          git reset -q -- 'data/*_batch_requests.jsonl' || true
          git diff --cached --quiet || git commit -m "backfill classification: ${{ inputs.stage }}"
          git push
